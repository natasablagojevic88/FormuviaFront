name: Docs

# Uputstvo za korisnike (docs/) se objavljuje na GitHub Pages pri svakoj izmeni na main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno objavljivanje u isto vreme; tekuće se pusti da se završi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated cita datum iz git istorije

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11, kao lokalno; npm 10 pada na "edgesOut" bug

      # package-lock.json je namerno van repoa, pa ne moze ni npm ci ni cache: npm.
      - run: npm install --no-audit --no-fund

      - run: npm run docs:build

      # Pages mora biti ukljucen rucno: Settings -> Pages -> Source: GitHub Actions.
      # (enablement: true ne radi - GITHUB_TOKEN ne sme da kreira Pages sajt.)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
