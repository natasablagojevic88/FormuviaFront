<header class="header">
  <button type="button" class="menu-button" (click)="layout.menuOpen.set(true)" [attr.aria-label]="'ui.menu' | t">
    <i class="fa-solid fa-bars"></i>
  </button>
  <a class="logo" routerLink="/" [title]="'ui.home' | t" [attr.aria-label]="'ui.home' | t"></a>

  <span class="brand-name">Formuvia</span>
  <span class="spacer"></span>

  <button type="button" class="theme-button" (click)="theme.next()"
    [title]="('ui.theme.' + theme.mode()) | t" [attr.aria-label]="('ui.theme.' + theme.mode()) | t">
    <i class="fa-solid"
      [class.fa-sun]="theme.mode() === 'light'"
      [class.fa-moon]="theme.mode() === 'dark'"
      [class.fa-circle-half-stroke]="theme.mode() === 'system'"></i>
  </button>

  <app-search-select class="language" appearance="dark" icon="fa-solid fa-globe" [options]="languageOptions"
    [ngModel]="language.current()" (ngModelChange)="language.change($event)" [ariaLabel]="'ui.language' | t" />
</header>
