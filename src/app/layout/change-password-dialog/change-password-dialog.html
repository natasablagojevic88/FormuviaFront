<form class="fd" (ngSubmit)="save()">
  <header class="fd-header">
    <div class="fd-titles">
      <h2 class="fd-title">{{ 'ui.changePassword.title' | t }}</h2>
      <p class="fd-subtitle">{{ 'ui.changePassword.subtitle' | t }}</p>
    </div>
    <button type="button" class="fd-close" (click)="close()" [attr.aria-label]="'ui.close' | t">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </header>

  <div class="fd-body">
    <div class="fd-field">
      <label class="fd-label" for="newPassword">{{ 'ui.changePassword.newPassword' | t }}</label>
      <div class="input-wrap">
        <input id="newPassword" name="newPassword" class="fd-input" [type]="showPassword() ? 'text' : 'password'"
          [(ngModel)]="newPassword" autocomplete="new-password" required />
        <button type="button" class="reveal" (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="(showPassword() ? 'ui.hidePassword' : 'ui.showPassword') | t">
          <i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
        </button>
      </div>
    </div>

    <div class="fd-field">
      <label class="fd-label" for="newPasswordAgain">{{ 'ui.changePassword.newPasswordAgain' | t }}</label>
      <input id="newPasswordAgain" name="newPasswordAgain" class="fd-input" [type]="showPassword() ? 'text' : 'password'"
        [(ngModel)]="newPasswordAgain" [class.fd-invalid]="mismatch()" autocomplete="new-password" required />
      @if (mismatch()) {
        <span class="fd-field-error">{{ 'ui.changePassword.notEqual' | t }}</span>
      }
    </div>
  </div>

  <footer class="fd-footer">
    <span class="fd-hint">{{ 'ui.allFieldsRequired' | t }}</span>
    <div class="fd-actions">
      <button type="button" class="fd-button fd-button-secondary" (click)="close()">{{ 'ui.cancel' | t }}</button>
      <button type="submit" class="fd-button fd-button-primary" [disabled]="!canSave()">
        <i class="fa-solid" [class.fa-floppy-disk]="!saving()" [class.fa-spinner]="saving()" [class.fa-spin]="saving()"></i>
        {{ 'ui.save' | t }}
      </button>
    </div>
  </footer>
</form>
