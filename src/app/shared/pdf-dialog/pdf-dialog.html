<div class="fd pdf">
  <header class="fd-header">
    <div class="fd-titles">
      <h2 class="fd-title">{{ data.title }}</h2>
    </div>
    <button type="button" class="fd-close" (click)="close()" [attr.aria-label]="'ui.close' | t">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </header>

  <div class="pdf-body">
    @if (source(); as viewer) {
      <iframe class="pdf-frame" [src]="viewer" [title]="data.title"></iframe>
    }
  </div>
</div>
