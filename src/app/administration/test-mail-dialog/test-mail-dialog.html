<form class="fd" (ngSubmit)="send()">
  <header class="fd-header">
    <div class="fd-titles">
      <h2 class="fd-title">{{ 'ui.smtp.testMailTitle' | t }}</h2>
      <p class="fd-subtitle">{{ data.name || ('ui.smtp.testMailSubtitle' | t) }}</p>
    </div>
    <button type="button" class="fd-close" (click)="close()" [attr.aria-label]="'ui.close' | t">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </header>

  <div class="fd-body">
    <div class="fd-grid">
      <div class="fd-field fd-field-wide">
        <label class="fd-label fd-required" for="email">{{ 'ui.smtp.email' | t }}</label>
        <input id="email" name="email" type="email" class="fd-input" [(ngModel)]="email"
          autocomplete="off" required />
        <span class="fd-help">{{ 'ui.smtp.emailHint' | t }}</span>
      </div>
    </div>
  </div>

  <footer class="fd-footer">
    <span class="fd-hint">{{ 'ui.requiredFieldsMarked' | t }}</span>
    <div class="fd-actions">
      <button type="button" class="fd-button fd-button-secondary" (click)="close()">{{ 'ui.cancel' | t }}</button>
      <button type="submit" class="fd-button fd-button-primary" [disabled]="!canSend()">
        <i class="fa-solid" [class.fa-paper-plane]="!sending()" [class.fa-spinner]="sending()"
          [class.fa-spin]="sending()"></i>
        {{ 'ui.smtp.testMailSend' | t }}
      </button>
    </div>
  </footer>
</form>
