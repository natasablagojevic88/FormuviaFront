<form class="fd" (ngSubmit)="save()">
  <header class="fd-header">
    <div class="fd-titles">
      <h2 class="fd-title">{{ (isNew ? 'ui.users.addTitle' : 'ui.users.editTitle') | t }}</h2>
      <p class="fd-subtitle">{{ 'ui.users.formSubtitle' | t }}</p>
    </div>
    <button type="button" class="fd-close" (click)="close()" [attr.aria-label]="'ui.close' | t">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </header>

  <div class="fd-body">
    @if (loading()) {
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i></div>
    } @else {
      <div class="fd-grid">
        <div class="fd-field">
          <label class="fd-label fd-required" for="username">{{ label('username') }}</label>
          <input id="username" name="username" class="fd-input" [(ngModel)]="user.username"
            autocomplete="off" required />
        </div>

        <div class="fd-field">
          <label class="fd-label fd-required" for="email">{{ label('email') }}</label>
          <input id="email" name="email" type="email" class="fd-input" [(ngModel)]="user.email"
            autocomplete="off" required />
        </div>

        <div class="fd-field">
          <label class="fd-label fd-required" for="name">{{ label('name') }}</label>
          <input id="name" name="name" class="fd-input" [(ngModel)]="user.name" autocomplete="off" required />
        </div>

        <div class="fd-field">
          <label class="fd-label fd-required" for="surname">{{ label('surname') }}</label>
          <input id="surname" name="surname" class="fd-input" [(ngModel)]="user.surname" autocomplete="off" required />
        </div>

        <div class="fd-field">
          <label class="fd-label" [class.fd-required]="isNew" for="password">{{ label('password') }}</label>
          <input id="password" name="password" type="password" class="fd-input" [(ngModel)]="user.password"
            autocomplete="new-password" [required]="isNew" />
          @if (!isNew) {
            <span class="fd-help">{{ 'ui.users.passwordHint' | t }}</span>
          }
        </div>

        <div class="fd-field">
          <span class="fd-label">{{ label('active') }}</span>
          <label class="switch">
            <input type="checkbox" name="active" [(ngModel)]="user.active" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-text">{{ (user.active ? 'ui.yes' : 'ui.no') | t }}</span>
          </label>
        </div>
      </div>
    }

    @if (errorMessage()) {
      <div class="fd-alert" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }
  </div>

  <footer class="fd-footer">
    <span class="fd-hint">{{ 'ui.requiredFieldsMarked' | t }}</span>
    <div class="fd-actions">
      <button type="button" class="fd-button fd-button-secondary" (click)="close()">{{ 'ui.cancel' | t }}</button>
      <button type="submit" class="fd-button fd-button-primary" [disabled]="!canSave()">
        <i class="fa-solid" [class.fa-floppy-disk]="!saving()" [class.fa-spinner]="saving()" [class.fa-spin]="saving()"></i>
        {{ 'ui.save' | t }}
      </button>
    </div>
  </footer>
</form>
