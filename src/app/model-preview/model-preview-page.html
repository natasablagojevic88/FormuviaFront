<app-page-header [title]="title()" [subtitle]="subtitle()">
  <button type="button" class="add-button" (click)="add()">
    <i class="fa-solid fa-plus"></i>
    {{ 'ui.add' | t }}
  </button>
</app-page-header>

<app-data-table [url]="tableUrl()" [historyUrl]="historyUrl" (loaded)="onLoaded($event)"
  (edit)="edit($event)" (remove)="remove($event)"></app-data-table>
