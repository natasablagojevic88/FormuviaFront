<app-page-header
  [title]="(modelName() ? modelName() + ' — ' : '') + ('ui.modelJobs.title' | t)"
  [subtitle]="'ui.modelJobs.subtitle' | t"
  [breadcrumb]="('ui.model.breadcrumb' | t) + (modelName() ? ' / ' + modelName() : '')"
  guide="modelJobs">
  <button type="button" class="back-button" (click)="back()">
    <i class="fa-solid fa-arrow-left"></i>
    {{ 'ui.back' | t }}
  </button>
  <button type="button" class="add-button" (click)="add()">
    <i class="fa-solid fa-plus"></i>
    {{ 'ui.add' | t }}
  </button>
</app-page-header>

<!-- what the user has to do, in order: without it a folder on the server says nothing -->
<app-page-guide key="modelJobs" title="ui.modelJobs.howTitle" [steps]="steps" note="ui.modelJobs.wholeFile"
  noteKind="warning" [openByDefault]="guideOpen()" />

<app-data-table [url]="tableUrl" [newRowValues]="newRowValues" [rowActions]="rowActions"
  (loaded)="onLoaded($event)" (edit)="edit($event)" (action)="rowAction($event)"
  (remove)="remove($event)"></app-data-table>
